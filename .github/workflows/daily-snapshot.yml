name: Build daily sports snapshot

on:
  schedule:
    - cron: '15 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-sports-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate snapshot from public Polymarket APIs
        run: node scripts/build-daily-picks.js
      - name: Commit the refreshed public feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/daily-picks.json
          if git diff --cached --quiet; then
            echo "Snapshot did not change; nothing to commit."
          else
            git commit -m "Refresh daily sports snapshot"
            git push
          fi
